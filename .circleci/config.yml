version: 2.1

orbs:
  docker: circleci/docker@2.8.2

jobs:
  build:
    executor: docker/machine
    steps:
      - checkout
      - docker/build:
          image: my-node-app
          tag: latest
      - run:
          name: Save Docker image
          command: docker save my-node-app | gzip > my-node-app.tar.gz
      - persist_to_workspace:
          root: .
          paths:
            - my-node-app.tar.gz

  test:
    executor: docker/machine
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Load Docker image
          command: gunzip -c ./my-node-app.tar.gz | docker load
      - run:
          name: Run Docker container
          command: docker run -d -p 8080:8080 --name my-node-app my-node-app
      - run:
          name: Test Docker container
          command: |
            sleep 10  # Attendre que le conteneur démarre
            curl --fail http://localhost:8080/ || (docker logs my-node-app && exit 1)

  push:
    executor: docker/machine
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Load Docker image
          command: gunzip -c ./my-node-app.tar.gz | docker load
      - docker/login:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
      - docker/push:
          image: my-node-app
          tag: latest
          registry: docker.io

workflows:
  version: 2
  build-and-test:
    jobs:
      - build
      - test:
          requires:
            - build
      - push:
          requires:
            - test
