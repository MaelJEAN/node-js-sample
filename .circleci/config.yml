version: 2.1
jobs:
  build:
    working_directory: ~/app
    docker:
      - image: cimg/base:2022.09
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build Docker image
          command: |
            TAG=0.1.$CIRCLE_BUILD_NUM
            docker build -t $DOCKERHUB_USERNAME/circleci-new-docker-example:$TAG .
      - run:
          name: Run Docker container
          command: |
            TAG=0.1.$CIRCLE_BUILD_NUM
            docker run -d -p 8080:8080 --name myapp_container $DOCKERHUB_USERNAME/circleci-new-docker-example:$TAG
      - run:
          name: Test Docker container
          command: |
            sleep 20 # Augmenter le temps d'attente pour que le conteneur soit prêt
            if ! curl --fail http://localhost:8080/; then
              echo "Failed to connect to the container. Logs:"
              docker logs myapp_container
              exit 1
            fi
      - run:
          name: Push application Docker image
          command: |
            TAG=0.1.$CIRCLE_BUILD_NUM
            echo $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_USERNAME --password-stdin
            docker push $DOCKERHUB_USERNAME/circleci-new-docker-example:$TAG